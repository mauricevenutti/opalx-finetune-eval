<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>OPALX fine-tune evaluation</title>
<style>
:root { color-scheme:light; --fg:#1f1f1f; --muted:#5f5f5f; --rule:#1f1f1f; --hair:#d4d4d4; --link:#1d4f91; }
body { margin:0; background:#fff; color:var(--fg); font:16px/1.55 Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; }
main { max-width:860px; margin:0 auto; padding:40px 16px 64px; }
h1 { font-weight:normal; font-size:28px; margin:0 0 4px; letter-spacing:.01em; }
.sub { color:var(--muted); font-style:italic; margin:0 0 28px; }
table { border-collapse:collapse; width:100%; border-top:1.5px solid var(--rule); border-bottom:1.5px solid var(--rule); }
th { font-variant:small-caps; letter-spacing:.04em; font-weight:normal; text-align:left; color:var(--muted); border-bottom:.75px solid var(--rule); padding:6px 10px; }
td { padding:8px 10px; border-bottom:1px solid var(--hair); vertical-align:top; }
tr:last-child td { border-bottom:none; }
a { color:var(--link); }
td.run a { font-size:18px; }
@media (max-width:600px) { td.desc { display:none; } }
</style>
</head>
